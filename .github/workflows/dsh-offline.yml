name: DSH offline regression

on:
  push:
    branches:
      - fix/dsh-retry-evidence-gate-followup
      - fix/dsh-mac-receive-visibility-action-review-20261122
      - feat/budget-gateway-offline-20261123
  # Test every draft PR target without silently omitting this repair line.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Python 3.12 / deterministic DSH bundle
    runs-on: ubuntu-24.04
    # Legacy oncall fixtures require os.environ["TMPDIR"]; runner defaults
    # may leave it unset. /tmp is physical on the Ubuntu CI image.
    env:
      TMPDIR: /tmp
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Inspect Python and tempfile paths
        run: |
          python --version
          python -m pip freeze
          python -c "import tempfile; from pathlib import Path; print('tempfile:', tempfile.gettempdir(), 'resolved:', Path(tempfile.gettempdir()).resolve())"
      - name: Check DSH source and generated configuration
        run: python tools/check_dsh.py
      - name: Check exact manifest and committed hashes before rebuild
        run: python tools/validate_bundle.py --check-only
      - name: Compile independent budget guard
        run: python -m compileall -q budget_guard
      - name: Run focused synthetic budget guard tests
        run: python -m pytest tests/test_budget_guard.py -q -ra
      - name: Run complete synthetic/offline regression
        run: python -m pytest tests/ tools/oncall/ -q -ra
      - name: Rebuild deterministic configuration and lock
        run: python tools/build_bundle.py
      - name: Recheck rebuilt configuration
        run: |
          python tools/check_dsh.py
          python tools/validate_bundle.py --check-only
      - name: Reject uncommitted generated changes
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"
